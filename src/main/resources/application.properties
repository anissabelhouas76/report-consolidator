spring.application.name=report-consolidator
server.port=8081
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
server.error.include-message=never
server.error.include-stacktrace=never
report.max-files=100
report.max-file-bytes=10485760
report.max-total-bytes=104857600
server.tomcat.max-part-count=120
